name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v30.2.0-tn3-soft-launch)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            jobs: 4
          # macOS arm64 (Apple Silicon). GitHub Actions is free for public
          # repos at all runner tiers, so the 10x billing tier on
          # macos-latest is not a cost concern here. Bounded -j (3) keeps
          # a from-scratch build inside the runner's memory budget.
          - os: macos-latest
            platform: macos-arm64
            jobs: 3
          # Windows binaries are cross-compiled from Linux using mingw-w64
          # via the depends system. Same runner tier as native Linux
          # (ubuntu-latest is 1x). The depends build (Boost + libevent +
          # sqlite3 as Windows static libs) takes 30-60 min from scratch;
          # the depends output is cached across runs so tag pushes stay
          # fast when the depends inputs haven't changed.
          - os: ubuntu-latest
            platform: windows-x86_64
            jobs: 4
            host: x86_64-w64-mingw32
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Resolve tag name
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building tag: $TAG"

      - name: Install apt deps (native Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.host == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              build-essential cmake pkg-config \
              libboost-dev libevent-dev libsqlite3-dev \
              ccache

      - name: Install brew deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # llvm dropped: Homebrew LLVM 22+ headers don't compose with the
          # Xcode macOS SDK. We use Apple Clang instead (see Configure step).
          brew install --quiet cmake boost libevent sqlite ccache

      - name: Install cross-compile toolchain (Windows via mingw-w64)
        if: matrix.host == 'x86_64-w64-mingw32'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
              build-essential cmake pkg-config \
              g++-mingw-w64-x86-64-posix \
              curl automake autoconf libtool \
              ccache zip
          # Boost's headers require the POSIX threading variant of mingw
          # (win32 threads lack the primitives Boost.Thread and friends
          # need). Both variants ship together; select posix explicitly.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Restore depends cache (cross-compile only)
        if: matrix.host != ''
        uses: actions/cache@v4
        with:
          path: depends/${{ matrix.host }}
          # Rebuild depends only when its inputs change. depends/packages/
          # holds one .mk per third-party dep (boost, libevent, sqlite,
          # ...); depends/hosts/${{ matrix.host }}.mk holds the toolchain
          # tuple. Hashing both catches version bumps and toolchain
          # changes without over-invalidating on unrelated repo edits.
          key: depends-${{ matrix.host }}-${{ hashFiles('depends/packages/*.mk', format('depends/hosts/{0}.mk', matrix.host)) }}
          restore-keys: |
            depends-${{ matrix.host }}-

      - name: Prime depends (cross-compile only)
        if: matrix.host != ''
        run: |
          # Builds Boost, libevent, sqlite3 and other deps as static
          # libraries targeting Windows, and writes
          # depends/${{ matrix.host }}/toolchain.cmake for cmake to pick
          # up. Skips wallet-optional stacks (Qt GUI, upnp, natpmp, zmq)
          # since our release binaries don't ship them.
          make -C depends HOST=${{ matrix.host }} -j${{ matrix.jobs }} \
               NO_QT=1 NO_UPNP=1 NO_NATPMP=1 NO_ZMQ=1 NO_USDT=1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: release-ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            release-ccache-${{ matrix.platform }}-

      - name: Configure (native)
        if: matrix.host == ''
        env:
          CCACHE_DIR: ${{ github.workspace }}/../.ccache
        run: |
          # ccache compiler launchers keep re-runs fast; bounded -j (set per
          # platform below) keeps a from-scratch build inside the runner's
          # memory budget -- unbounded -j is what blew up the first attempt.
          # On macOS we deliberately use Apple Clang (the system default)
          # rather than Homebrew LLVM: Homebrew LLVM 22+ has stdc++ headers
          # that no longer compose with Xcode's macOS SDK (basic types like
          # size_t and __uint32_t fail to resolve). Apple Clang in current
          # Xcode supports the consteval features we need.
          ARGS=( -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=OFF
                 -DCMAKE_C_COMPILER_LAUNCHER=ccache
                 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache )
          cmake -B build "${ARGS[@]}"

      - name: Configure (cross-compile)
        if: matrix.host != ''
        env:
          CCACHE_DIR: ${{ github.workspace }}/../.ccache
        run: |
          # The depends system wrote a cmake toolchain file pointing at the
          # mingw-w64 compilers and the static deps we just built. That
          # toolchain sets CMAKE_SYSTEM_NAME=Windows, so binaries land as
          # .exe files and Bitcoin Core's cmake picks the Windows code paths.
          cmake -B build \
                --toolchain depends/${{ matrix.host }}/toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=OFF

      - name: Build (bounded parallelism)
        run: |
          cmake --build build --parallel ${{ matrix.jobs }} \
                --target truenorthd truenorth-cli truenorth-miner

      - name: Strip release symbols (native)
        if: matrix.host == ''
        run: |
          strip build/bin/truenorthd build/bin/truenorth-cli build/bin/truenorth-miner || true
          ls -la build/bin/

      - name: Strip release symbols (cross-compile)
        if: matrix.host != ''
        run: |
          # mingw-w64-x86_64-strip is the cross strip tool; targets .exe files.
          ${{ matrix.host }}-strip \
              build/bin/truenorthd.exe \
              build/bin/truenorth-cli.exe \
              build/bin/truenorth-miner.exe || true
          ls -la build/bin/

      - name: Smoke test (native only)
        if: matrix.host == ''
        timeout-minutes: 5
        run: |
          DD=$(mktemp -d)
          ./build/bin/truenorthd -regtest -datadir="$DD" -daemon
          # bitcoind -daemon hides startup errors and -rpcwait sometimes
          # gives up before the cookie file exists. Poll for it.
          COOKIE="$DD/regtest/.cookie"
          for _ in $(seq 1 60); do
              [ -f "$COOKIE" ] && break
              sleep 1
          done
          if [ ! -f "$COOKIE" ]; then
              echo "FAIL: truenorthd did not create the cookie file within 60s"
              tail -100 "$DD/regtest/debug.log" 2>/dev/null || echo "(no debug.log)"
              exit 1
          fi
          ./build/bin/truenorth-cli -regtest -datadir="$DD" -rpcwait createwallet ci > /dev/null
          ADDR=$(./build/bin/truenorth-cli -regtest -datadir="$DD" getnewaddress)
          ./build/bin/truenorth-cli -regtest -datadir="$DD" generatetoaddress 1 "$ADDR" > /dev/null
          COUNT=$(./build/bin/truenorth-cli -regtest -datadir="$DD" getblockcount)
          ./build/bin/truenorth-cli -regtest -datadir="$DD" stop > /dev/null
          [ "$COUNT" = "1" ] || { echo "FAIL: smoke produced $COUNT blocks"; exit 1; }

      - name: Package tarball (native)
        if: matrix.host == ''
        id: package_native
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          STAGE="truenorth-${TAG}-${{ matrix.platform }}"
          mkdir -p "${STAGE}/bin" "${STAGE}/doc"
          cp build/bin/truenorthd          "${STAGE}/bin/"
          cp build/bin/truenorth-cli       "${STAGE}/bin/"
          cp build/bin/truenorth-miner   "${STAGE}/bin/"
          cp README.md COPYING "${STAGE}/"
          # Tester-relevant docs travel with the binary so an onion-only
          # operator doesn't have to bounce back to a browser.
          cp doc/testnet.md "${STAGE}/doc/"
          tar czf "${STAGE}.tar.gz" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256" 2>/dev/null \
            || shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          ls -la "${STAGE}.tar.gz" "${STAGE}.tar.gz.sha256"
          cat "${STAGE}.tar.gz.sha256"

      - name: Package zip (Windows cross-compile)
        if: matrix.host != ''
        id: package_zip
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          STAGE="truenorth-${TAG}-${{ matrix.platform }}"
          mkdir -p "${STAGE}/bin" "${STAGE}/doc"
          cp build/bin/truenorthd.exe        "${STAGE}/bin/"
          cp build/bin/truenorth-cli.exe     "${STAGE}/bin/"
          cp build/bin/truenorth-miner.exe   "${STAGE}/bin/"
          cp README.md COPYING "${STAGE}/"
          cp doc/testnet.md "${STAGE}/doc/"
          zip -r "${STAGE}.zip" "${STAGE}"
          sha256sum "${STAGE}.zip" > "${STAGE}.zip.sha256"
          ls -la "${STAGE}.zip" "${STAGE}.zip.sha256"
          cat "${STAGE}.zip.sha256"

      - name: Upload to GitHub Release
        # ncipollo/release-action handles existing releases via allowUpdates,
        # avoiding the "tag_name already_exists" PATCH failure that
        # softprops/action-gh-release@v2 hits on re-runs against an existing
        # tag.
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generateReleaseNotes: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          # Don't mark soft-launch tags as prerelease -- they're the canonical
          # current release of the chain. Only `rc` and `pre` qualifiers stay
          # in prerelease.
          prerelease: ${{ contains(steps.tag.outputs.tag, 'rc') || contains(steps.tag.outputs.tag, 'pre') }}
          makeLatest: true
          # Match both .tar.gz (Linux, macOS) and .zip (Windows) artifacts
          # for the current platform.
          artifacts: "truenorth-*-${{ matrix.platform }}.tar.gz,truenorth-*-${{ matrix.platform }}.tar.gz.sha256,truenorth-*-${{ matrix.platform }}.zip,truenorth-*-${{ matrix.platform }}.zip.sha256"
