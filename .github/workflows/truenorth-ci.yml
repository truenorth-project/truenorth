name: TrueNorth CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands -- avoids
# burning Actions minutes on stacked pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint -- clang-format + codespell on TrueNorth additions
    # Ubuntu runners are the 1x billing tier; macos-latest is 10x. Lint has
    # no platform-specific reason to live on macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format codespell
          clang-format --version | head -1
          codespell --version | head -1

      - name: clang-format dry-run on TrueNorth additions
        # Strict check on our additions only; inherited Bitcoin Core code is
        # out of scope for this job (formatting inherited code creates
        # painful merge diffs against upstream).
        run: |
          clang-format --dry-run --Werror \
            src/truenorth/genesis_spec.h \
            src/truenorth/mine_genesis.cpp \
            src/truenorth/miner.cpp \
            src/truenorth/numa.h \
            src/truenorth/numa.cpp \
            src/truenorth/qrh.h \
            src/truenorth/qrh.cpp \
            src/truenorth/randomx_wrapper.h \
            src/truenorth/randomx_wrapper.cpp \
            src/truenorth/seed_key.h \
            src/truenorth/seed_key.cpp \
            src/truenorth/system_mem.h \
            src/truenorth/system_mem.cpp \
            src/checkpoints.h \
            src/checkpoints.cpp \
            src/test/truenorth_tests.cpp \
            src/test/checkpoints_tests.cpp

      - name: codespell on TrueNorth additions
        # Spell-check our own files only. The shared word-exception list
        # (test/lint/spelling.ignore-words.txt) avoids the bitcoin-core
        # false-positives (e.g. "tx", "nin"). Errors do fail the job --
        # spelling regressions in user-facing docs are worth blocking on.
        run: |
          codespell \
            --ignore-words=test/lint/spelling.ignore-words.txt \
            src/truenorth/ \
            test/truenorth/ \
            doc/testnet.md \
            README.md \
            TRUENORTH_SPEC.md

  build-and-smoke-test:
    name: Linux x86_64 -- build + regtest smoke test
    # Ubuntu runners are 1x billing; macOS is 10x. "Does the chain build and
    # mine a regtest block?" has no macOS-specific reason to live there. If
    # we ever want belt-and-suspenders cross-platform coverage, add a
    # separate scheduled macOS build (weekly, on a cron) rather than burning
    # 10x minutes on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install apt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config \
            libboost-dev libevent-dev libsqlite3-dev \
            ccache
          cmake --version | head -1
          cc --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/../.ccache
        # No explicit compiler paths -- let CMake pick the system default
        # (g++ on Ubuntu). ENABLE_IPC=OFF skips Cap'n Proto, which we don't
        # need for the smoke test.
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_IPC=OFF

      - name: Build truenorthd + truenorth-cli + truenorth-miner + test_bitcoin
        # truenorth-miner is needed for the regression scripts below.
        # test_bitcoin is the Boost.Test runner for the unit suite.
        # Bounded -j: GitHub Actions runners (7 GiB RAM on ubuntu-latest)
        # OOM-kill cc1plus when -j is unbounded on a from-scratch build.
        run: cmake --build build --parallel 4 --target truenorthd truenorth-cli truenorth-miner test_bitcoin

      - name: Run truenorth_tests unit suite
        timeout-minutes: 5
        # The TrueNorth-specific cases (LWMA, seed_key, tail emission,
        # GetPoWHash, RandomX wrapper), run verbosely so a failure here is
        # readable without digging. The whole-suite sweep below covers these
        # too, but not with per-case output.
        run: ./build/bin/test_bitcoin --run_test=truenorth_tests --log_level=test_suite

      - name: Run full unit suite against the known-failing baseline
        timeout-minutes: 30
        # Each suite runs in its own process: an aborting suite otherwise
        # takes the whole run with it and leaves gArgs populated, so every
        # later suite dies on a duplicate-AddArg assertion and one real
        # failure hides ~140 others.
        #
        # The failing set is compared against test/ci-known-failing-suites.txt
        # in both directions, so a new failure and a newly-fixed suite both
        # break the build. Everything in that baseline is blocked on the
        # mainnet placeholder genesis and should empty out at the ceremony.
        #
        # This was previously narrowed to truenorth_tests on the grounds that
        # the full suite was slow and flaky. The suite is in much better shape
        # now (120 pass / 23 known-fail, stable across repeated local runs),
        # so it is worth gating on. If it does turn out to flake on CI
        # hardware, move this step to a nightly schedule rather than deleting
        # it -- a daily signal beats none.
        run: ./test/run-unit-suites.sh build/bin/test_bitcoin test/ci-known-failing-suites.txt

      - name: Regression -- 2-node sync
        timeout-minutes: 5
        run: bash test/truenorth/local_testnet_sync.sh

      - name: Regression -- multi-tx mining (template-tx inclusion + BIP141 commitment)
        timeout-minutes: 5
        run: bash test/truenorth/local_testnet_multitx.sh

      - name: Regression -- reorg + fork-choice
        timeout-minutes: 5
        run: bash test/truenorth/local_testnet_reorg.sh

      - name: Regression -- IBD (cold-cache sync)
        timeout-minutes: 5
        run: bash test/truenorth/local_testnet_ibd.sh
        # Note: local_testnet_seed_rotation.sh is intentionally NOT in CI --
        # it mines 2122 blocks to cross the epoch boundary, which takes
        # ~2 minutes per push. The seed_key code path is well-covered by
        # the four `seed_key_*` cases in truenorth_tests above; this is a
        # belt-and-suspenders manual check, run from `test/truenorth/all.sh`
        # or directly before a release tag.
